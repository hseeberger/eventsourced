[package]
name          = "eventsourced-nats"
description   = "NATS implementation for EventSourced EventLog and SnapshotStore."
version       = "0.17.0"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
repository    = { workspace = true }
documentation = "https://docs.rs/eventsourced-nats/latest/eventsourced_nats/"
publish       = true

[dependencies]
eventsourced = { path = "../eventsourced", version = "0.27.1" }
async-nats   = { version = "0.53" }
bytes        = { version = "1.11" }
error-ext    = { version = "0.4" }
futures      = { version = "0.3" }
prost        = { version = "0.14" }
secrecy      = { version = "0.10", features = [ "serde" ] }
serde        = { version = "1.0", features = [ "derive" ] }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
composed       = { workspace = true }
config         = { workspace = true }
eventsourced   = { path = "../eventsourced", version = "0.27.1", features = [ "serde_json" ] }
testcontainers = { workspace = true }
tokio          = { workspace = true, features = [ "macros" ] }
uuid           = { workspace = true }

[build-dependencies]
anyhow      = { workspace = true }
prost-build = { workspace = true }
walkdir     = { workspace = true }
