[package]
name          = "eventsourced-nats"
description   = "NATS implementation for EventSourced EventLog and SnapshotStore."
version       = "0.16.0"
edition       = { workspace = true }
license       = { workspace = true }
readme        = "README.md"
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = "https://docs.rs/eventsourced-nats/latest/eventsourced_nats/"
publish       = true

[dependencies]
eventsourced = { path = "../eventsourced", version = "0.27.1" }
async-nats   = { workspace = true }
bytes        = { workspace = true }
error-ext    = { workspace = true }
futures      = { workspace = true }
prost        = { workspace = true }
secrecy      = { workspace = true }
serde        = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
composed       = { workspace = true }
config         = { workspace = true }
eventsourced   = { path = "../eventsourced", version = "0.27.1", features = [ "serde_json" ] }
testcontainers = { workspace = true }
tokio          = { workspace = true, features = [ "macros" ] }
uuid           = { workspace = true }

[build-dependencies]
anyhow      = { workspace = true }
prost-build = { workspace = true }
walkdir     = { workspace = true }
