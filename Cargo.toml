[workspace]
members = [
    "eventsourced",
    "eventsourced-nats",
    "eventsourced-postgres",
    "eventsourced-projection",
    "examples/counter",
    "examples/counter-nats",
    "examples/counter-postgres",
]
resolver = "2"

[workspace.package]
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/hseeberger/eventsourced"

[workspace.dependencies]
anyhow                 = { version = "1.0" }
assert_matches         = { version = "1.5" }
async-stream           = { version = "0.3" }
composed               = { version = "0.1" }
config                 = { version = "0.15" }
configured             = { version = "0.10" }
error-ext              = { version = "0.4" }
futures                = { version = "0.3" }
humantime-serde        = { version = "1.1" }
pin-project            = { version = "1.1" }
prost-build            = { version = "0.14" }
serde                  = { version = "1.0", features = [ "derive" ] }
testcontainers         = { version = "0.27" }
testcontainers-modules = { version = "0.15" }
thiserror              = { version = "2.0" }
tokio                  = { version = "1", features = [ "sync" ] }
tracing                = { version = "0.1" }
tracing-subscriber     = { version = "0.3", features = [ "env-filter", "fmt", "json" ] }
tracing-test           = { version = "0.2" }
trait-variant          = { version = "0.1" }
uuid                   = { version = "1.23", features = [ "serde", "v7" ] }
walkdir                = { version = "2.5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
